####################################################################################

########## This code is also used in the divorce and custody complaints. ###########
###### If you edit, must make sure divorce and custody complaints still work. ######

####################################################################################
---
template: public_assistance_template
subject: |
  What are some examples?
content: |
  This may include help such as SNAP or food stamps, Medicaid, TANF, WIC, cash assistance, child care assistance, or SSI (Supplemental Security Income).
  
  **Note:** Social Security Disability Insurance benefits (SSDI) are **not** based on having low income, so if that is the only benefit that you receive, select **No**.

---
depends on: pa_received
code: |
  if pa_received == False:
    pa_food_assistance_program = False
    pa_medicaid = False
    pa_family_independence_program = False
    pa_women_infants_children = False
    pa_state_disability = False
    pa_state_emergency_relief = False
    pa_refugee_assistance = False
    pa_supplemental_security = False
    pa_other = False
---
code: >-
  pa_mdhhs = pa_food_assistance_program or pa_medicaid or pa_family_independence_program or 
  pa_women_infants_children or pa_state_disability or pa_state_emergency_relief or 
  pa_refugee_assistance
depends on:
  - pa_food_assistance_program 
  - pa_medicaid 
  - pa_family_independence_program 
  - pa_women_infants_children
  - pa_state_disability
  - pa_state_emergency_relief
  - pa_refugee_assistance
---
reconsider: True
code: |
  # "Other" meaning types of assistance that are not explicitly listed on MC20 Fee Waiver Request
  pa_other_calc = pa_received and (pa_state_disability or pa_state_emergency_relief or pa_refugee_assistance or pa_other)

---
reconsider: True
code: |
  # "Other" meaning types of assistance that are not explicitly listed on MC20 Fee Waiver Request
  pa_other_list = ''

  if pa_received:
    if pa_state_disability:
      pa_other_list += 'State Disability Assistance (SDA), '
    if pa_state_emergency_relief:
      pa_other_list += 'State Emergency Relief (SER), '
    if pa_refugee_assistance:
      pa_other_list += 'Refugee Assistance Program (RAP), '
    if pa_other:
      pa_other_list += pa_other_types + ', '
    pa_other_list = pa_other_list[0:-2]

---
reconsider: True
code: |
  pa_case_numbers = ''

  if pa_mdhhs:
    pa_case_numbers += pa_mdhhs_case_number + ', '
  if pa_other:
    pa_case_numbers += pa_other_case_numbers + ', '
  if insert_pii_form:
    if insert_mc_97a:
      pa_case_numbers += 'See MC 97a ref. no. 10, '
    if insert_mc_97:
      pa_case_numbers += 'See MC 97 ref. no. 5, '
  pa_case_numbers = pa_case_numbers[0:-2]

---
id: MDHHS case number
question: MDHHS Public Assistance
subquestion: |
  Enter your MDHHS case number here.
  
  ${ collapse_template (mdhhs_case_number_template) }
fields:
  - 'MDHHS Case #': pa_mdhhs_case_number
---
template: mdhhs_case_number_template
subject: How do I find my case number?
content: |
  Your MDHHS case number should be on any notices you have gotten from MDHHS regarding your benefits such as food assistance (FAP), cash assistance (FIP), Medicaid, or Women Infants and Children benefits (WIC).
  
  If you cannot find any recent notices, [contact your local office](https://www.michigan.gov/mdhhs/inside-mdhhs/county-offices) to ask for your case number. You must enter your case number to ask for a fee waiver.

---
id: public assistance SSA
question: SSA Public Assistance
subquestion: |
  Enter your Social Security Administration (SSA) case number here.

  SSA case numbers usually use your Social Security number (SSN), so your forms will include a *Protected Personal Identifying Information* form that you will file along with your *Fee Waiver Request* form.
fields:
  - 'SSA Case #': pa_ssa_number

---
code: |
  unable_to_pay = not pa_received and not legal_service_representation
---
code: |
  signature_fields = ['users[0].signature']

---
reconsider: True
code: |
  insert_pii_form = pa_supplemental_security and not (pa_mdhhs or pa_other)
  #VALUE(PA SSI TF) AND !(DHS public assistance received CO OR VALUE(PA other TF))
---
# ALDocument objects specify the metadata for each template
objects:
  - fee_waiver_attachment: >-
      ALDocument.using(title="Fee Waiver Request - MC 20", 
      filename="Fee Waiver Request - MC 20", has_addendum=True if tool_ID == "fee_waiver" else False,
      default_overflow_message=AL_DEFAULT_OVERFLOW_MESSAGE)
  - protected_pii_mc_97a_attachment: >-
      ALDocument.using(title="Protected Personal Identifying Information - MC 97a", 
      filename="Protected Personal Identifying Information - MC 97a", has_addendum=False)
---
# for divorce/custody complaints, enabling handled in divorce/custody package
if: tool_ID == "fee_waiver"
code: |
  fee_waiver_attachment.enabled = True
---
# Just a little block to set some PDF variables in one place that will be used
# over multiple attachments
reconsider: True
code: |
  if the_court.type == 'circuit':
    trial_court_circuit = the_court.number
  else:
    trial_court_circuit = ''

  if the_court.type == 'district':
    trial_court_district = the_court.number
  else:
    trial_court_district = ''

  if the_court.type == 'probate':
    trial_court_county = 'PROBATE COURT OF ' + the_court.address.county.upper()
  else:
    trial_court_county = the_court.address.county.upper()

  trial_court_address_on_one_line = the_court.address.on_one_line()
  trial_court_phone_number = the_court.phone
  
  trial_court_judge = ''  # As of March 2024, not implemented (per A2J tool)

  if tool_ID in ["divorce_complaint", "custody_complaint"]:
    case_type = "Parties"
    users[0].has_attorney = False
    other_parties[0].has_attorney = False
  
  if case_type == 'Matter':
    plaintiffs_name = "N/A"
    defendants_name = "N/A"
  else:
    plaintiffs_name = plaintiffs[0]
    defendants_name = defendants[0]

  if case_type == 'Parties' and plaintiffs[0].has_attorney:
    plaintiffs_attorney_name = plaintiff_attorneys[0].name.full()
    plaintiffs_attorney_bar_number = plaintiff_attorneys[0].bar_number
    plaintiffs_attorney_address_block = f"{ plaintiff_attorneys[0].address.line_one() }\n{ plaintiff_attorneys[0].address.line_two() }"
    #plaintiffs_attorney_phone_number = phone_number_formatted(plaintiff_attorneys[0].phone_number)
    plaintiffs_attorney_phone_number = word("Unknown phone") if plaintiff_attorneys[0].no_phone_number else plaintiff_attorneys[0].phone_numbers()
  else:
    plaintiffs_attorney_name = ''
    plaintiffs_attorney_bar_number = ''
    plaintiffs_attorney_address_block = ''
    plaintiffs_attorney_phone_number = ''
    
  if case_type == 'Parties' and defendants[0].has_attorney:
    defendants_attorney_name = defendant_attorneys[0].name.full()
    defendants_attorney_bar_number = defendant_attorneys[0].bar_number
    defendants_attorney_address_block = f"{ defendant_attorneys[0].address.line_one() }\n{ defendant_attorneys[0].address.line_two() }"
    defendants_attorney_phone_number = word("Unknown phone") if defendant_attorneys[0].no_phone_number else defendant_attorneys[0].phone_numbers()
  else:
    defendants_attorney_name = ''
    defendants_attorney_bar_number = ''
    defendants_attorney_address_block = ''
    defendants_attorney_phone_number = ''

---
attachment:
  name: fee waiver request mc 20
  filename: fee_waiver_request_mc_20
  variable name: fee_waiver_attachment[i]
  skip undefined: False
  pdf template file: fee_waiver_request_mc_20.pdf
  editable: False
  fields:
    - "trial_court_circuit": ${ trial_court_circuit }
    - "trial_court_district": ${ trial_court_district }
    - "trial_court_county": ${ trial_court_county }
    - "trial_court_address_on_one_line": |
        ${ '' if court_type == "circuit" and court_count > 1 and unknown_circuit_location else the_court.address.on_one_line() }
    - "trial_court_phone_number": |
        ${ '' if court_type == "circuit" and court_count > 1 and unknown_circuit_location else the_court.phone }
    - "docket_number": ${ docket_number }
    - "in_the_matter_of": |
        ${ in_the_matter_of if case_type == 'Matter' else '' }

    - "plaintiffs_name": ${ plaintiffs_name }
    - "defendants_name": ${ defendants_name }
    - "plaintiffs_address_and_phone": |
        % if case_type == 'Parties':
        ${ plaintiffs[0].address.line_one() }
        ${ plaintiffs[0].address.line_two() }
        ${ word("No phone") if plaintiffs[0].no_phone_number else plaintiffs[0].phone_numbers() }
        % else:
        ${ word('') }
        % endif
    - "defendants_address_and_phone": |
        % if case_type == 'Parties':
        ${ defendants[0].address.line_one() }
        ${ defendants[0].address.line_two() }
        ${ word("Unknown phone") if defendants[0].no_phone_number else defendants[0].phone_numbers() }
        % else:
        ${ word('') }
        % endif
    
    - "plaintiffs_attorney_name": ${ plaintiffs_attorney_name }
    - "plaintiffs_attorney_bar_number": ${ plaintiffs_attorney_bar_number }
    - "plaintiffs_attorney_address_and_phone": |
        % if case_type == 'Parties' and plaintiffs[0].has_attorney:
        ${ plaintiffs_attorney_address_block }
        ${ plaintiffs_attorney_phone_number }
        % endif
    - "defendants_attorney_name": ${ defendants_attorney_name }
    - "defendants_attorney_bar_number": ${ defendants_attorney_bar_number }
    - "defendants_attorney_address_and_phone": |
        % if case_type == 'Parties' and defendants[0].has_attorney:
        ${ defendants_attorney_address_block }
        ${ defendants_attorney_phone_number }
        % endif

    - "pa_received": ${ pa_received }
    - "pa_food_assistance_program": ${ pa_food_assistance_program }
    - "pa_medicaid": ${ pa_medicaid }
    - "pa_family_independence_program": ${ pa_family_independence_program }
    - "pa_women_infants_children": ${ pa_women_infants_children }
    - "pa_supplemental_security": ${ pa_supplemental_security }
    - "pa_other": ${ pa_other_calc }
    - "pa_other_list": ${ pa_other_list }
    - "pa_case_numbers": ${ pa_case_numbers }

    - "legal_service_representation": ${ False if pa_received else legal_service_representation }
    - "legal_service_provider": |
        ${ legal_service_provider if not pa_received and legal_service_representation else '' }
    - "unable_to_pay": ${ unable_to_pay }
    - "household_income": ${ '%.2f' % household_income if unable_to_pay else '' }
    - "household_income_period": ${ household_income_period if unable_to_pay else '' }
    - "household_size": ${ household_size if unable_to_pay else '' }
    - "household_income_sources": |
        % if not unable_to_pay: 
        ${ '' }
        % elif income_employment and income_unemployment:
        Both employment and unemployment benefits
        % elif income_unemployment:
        Unemploymemt benefits
        % elif income_employment:
        Employment
        % else:
        n/a
        % endif
    - "assets_list": |
        ${ fee_waiver_attachment.safe_value("assets_list") if unable_to_pay else '' }
    - "obligations_list": |
        ${ fee_waiver_attachment.safe_value("obligations_list") if unable_to_pay else '' }
    - "signature_date": |
        % if MLH_esign == True:
        ${ signature_date }
        % else:
        ${ '' }
        % endif
    - "users_signature": |
        % if MLH_esign == True:
        /s/ ${ users[0] }
        % else:
        ${ '' }
        % endif
    - "pursuant_to": |
        % if MLH_esign == True:
        ${ MLH_esign_tag }
        % else:
        ${ '' }
        % endif

---
attachment:
  variable name: fee_waiver_attachment.addendum
  pdf template file: feewaiver_addendum_template.pdf
  skip undefined: False
  editable: False
  fields:
    - "trial_court_circuit": ${ trial_court_circuit }
    - "trial_court_district": ${ trial_court_district }
    - "trial_court_county": ${ trial_court_county }
    - "trial_court_address_on_one_line": |
        ${ '' if court_type == "circuit" and court_count > 1 and unknown_circuit_location else the_court.address.on_one_line() }
    - "trial_court_phone_number": |
        ${ '' if court_type == "circuit" and court_count > 1 and unknown_circuit_location else the_court.phone }
    - "docket_number": ${ docket_number }
    - "in_the_matter_of": |
        ${ in_the_matter_of if case_type == 'Matter' else '' }
    - "plaintiffs_name": ${ plaintiffs_name }
    - "defendants_name": ${ defendants_name }
    - "overflow": |
        % for field in fee_waiver_attachment.overflow():
        ${ field.label }
        ${ indent(field.overflow_value(overflow_message=fee_waiver_attachment.default_overflow_message)) }
        
        % endfor

---
attachment:
  name: protected pii MC 97a
  variable name: protected_pii_mc_97a_attachment[i]
  skip undefined: True
  pdf template file: protected_pii_mc_97a.pdf
  editable: False
  fields:
      - "trial_court_circuit": ${ trial_court_circuit }
      - "trial_court_district": ${ trial_court_district }
      - "county_choice": ${ county_choice.upper() if court_type == 'probate' else ''}
      - "trial_court_address_on_one_line": |
          ${ '' if court_type == "circuit" and court_count > 1 and unknown_circuit_location else the_court.address.on_one_line() }
      - "trial_court_phone_number": |
          ${ '' if court_type == "circuit" and court_count > 1 and unknown_circuit_location else the_court.phone }
      - "docket_number": ${ docket_number }
      - "trial_court_judge": ${ trial_court_judge }
      - "plaintiffs_name": ${ plaintiffs_name }
      - "defendants_name": ${ defendants_name }
      - "users1_name": ${ users[0].name.full() }
      - "in_the_matter_of": ${ in_the_matter_of }
      - "form_name": "Fee Waiver Request"
      - "pa_ssa_number": ${ pa_ssa_number }
      - "today": ${ today() }